name: Run tests on PR to main
on:
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22"]
    steps:
      - uses: actions/checkout@v2

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}

      # Optional env for the tests (add to .env the same way if needed):
      #   TEST_BASE_URL  - API base URL to test against instead of the production default, e.g. http://localhost:3017/api/
      #   TEST_MEDIA_IDS - comma-separated IDs of fully processed video media; otherwise the tests list the account's ready media
      #   TEST_WEBHOOK_URL - public endpoint answering 2xx that the webhook tests register; Webhook.Check's valid case is skipped without it
      - name: Create env file
        run: |
          touch .env
          echo TEST_PUBLIC_KEY=${{ secrets.TEST_PUBLIC_KEY }} >> .env
          echo TEST_SECRET_KEY=${{ secrets.TEST_SECRET_KEY }} >> .env
          echo TEST_ANONYMOUS_SECRET_KEY=${{ secrets.TEST_ANONYMOUS_SECRET_KEY }} >> .env
          echo TEST_ANONYMOUS_PUBLIC_KEY=${{ secrets.TEST_ANONYMOUS_PUBLIC_KEY }} >> .env

      - name: Run tests
        run: go test -v
