paths:
  /analytics/data:
    get:
      description: Returns a page of how much data your media delivered, in time buckets.
      operationId: getDataUsage
      parameters:
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: interval
        required: false
        schema:
          enum:
          - hour
          - day
          - week
          - month
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUsageResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Internal Server Error
      security:
      - Bearer: []
      - BasicAuth: []
      summary: Delivery volume over time
      tags:
      - analytics
      x-client-action: getDataUsage
      x-client-paginated: true
      x-group-parameters: true
